<!doctype html>

    <style>
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 700; src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); }
      :root {
        --navy2: #0b0f20; --line: #26315a; --cyan: #36d1ff; --blue: #2f6bff; --orange: #ff9b25;
        --muted: #8d98c4; --red: #ff4d5e; --green: #2fd67b; --f: "Montserrat", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--navy2); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--f); color: #fff; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      svg { display: block; overflow: visible; }

      #bg { background: linear-gradient(180deg, #151b36 0%, #10152b 55%, #0b0f20 100%); overflow: hidden; }
      .pnl { position: absolute; border: 3px solid var(--line); border-radius: 26px; background: rgba(24, 32, 61, 0.55); }
      .rim { position: absolute; border-radius: 50%; }
      #rim-a { left: 380px; top: 420px; width: 1200px; height: 1200px; background: radial-gradient(closest-side, rgba(54, 209, 255, 0.16), transparent); }
      #rim-b { left: -500px; top: 1100px; width: 1100px; height: 1100px; background: radial-gradient(closest-side, rgba(47, 107, 255, 0.18), transparent); }
      #floor { position: absolute; left: 0; top: 1500px; width: 1080px; height: 420px; background: linear-gradient(180deg, #0e1328, #090c1a); border-top: 3px solid rgba(54, 209, 255, 0.25); }
      #accent { position: absolute; left: 0; top: 1460px; width: 1080px; height: 4px; background: var(--orange); opacity: 0.45; }

      .cap { position: absolute; left: 50px; top: 200px; width: 980px; text-align: center; font: 800 80px/1.12 var(--f); letter-spacing: -0.01em; text-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), 0 0 30px rgba(0, 0, 0, 0.5); opacity: 0; }
      .cap b { color: var(--orange); font-weight: 900; }

      .counter { display: inline-flex; align-items: baseline; gap: 10px; padding: 18px 34px; border: 5px solid var(--cyan); border-radius: 30px; background: rgba(9, 16, 36, 0.88); box-shadow: 0 0 34px rgba(54, 209, 255, 0.35), inset 0 0 20px rgba(54, 209, 255, 0.12); font-weight: 900; white-space: nowrap; }
      .counter.or { border-color: var(--orange); box-shadow: 0 0 34px rgba(255, 155, 37, 0.35); }
      .counter .v { font-size: 76px; line-height: 1; }
      .counter .u { font-size: 38px; color: var(--muted); font-weight: 800; }
      .chipwrap { width: 960px; text-align: center; }
      .cal { position: absolute; width: 170px; height: 190px; border-radius: 26px; background: #fff; overflow: hidden; box-shadow: 0 14px 0 rgba(0, 0, 0, 0.3); }
      .cal .top { height: 50px; background: var(--red); color: #fff; font: 800 24px/50px var(--f); letter-spacing: 0.1em; text-align: center; }
      .cal .num { position: absolute; left: 0; right: 0; top: 54px; text-align: center; color: #141a33; font: 900 100px/130px var(--f); }
      .chip { display: inline-block; padding: 14px 28px; border-radius: 22px; font: 800 36px/1 var(--f); letter-spacing: 0.03em; white-space: nowrap; }
      .chip.cy { border: 4px solid var(--cyan); background: rgba(47, 107, 255, 0.35); }
      .chip.or { border: 4px solid var(--orange); background: rgba(255, 155, 37, 0.18); color: var(--orange); }
      .glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 196, 70, 0.6), rgba(255, 155, 37, 0.2) 55%, transparent); }
      .sym { width: 200px; text-align: center; font: 900 120px/1 var(--f); color: var(--orange); }
      .note { font: 600 28px/1.3 var(--f); color: var(--muted); }

      .bcol { border-radius: 22px 22px 6px 6px; }
      .bval { width: 320px; text-align: center; font: 900 44px/1 var(--f); white-space: nowrap; }
      .blab { width: 320px; text-align: center; font: 800 30px/1 var(--f); color: var(--muted); letter-spacing: 0.05em; }

      .srow { left: 60px; width: 960px; height: 210px; display: flex; align-items: center; gap: 26px; padding: 0 34px; border-radius: 34px; border: 4px solid var(--line); background: rgba(9, 16, 36, 0.85); }
      .srow .badge { flex: none; min-width: 140px; padding: 16px 18px; border-radius: 22px; border: 4px solid var(--cyan); background: rgba(47, 107, 255, 0.35); font: 900 40px/1 var(--f); text-align: center; }
      .srow .sic { flex: none; width: 110px; }
      .srow .stx { flex: 1; font: 700 34px/1.2 var(--f); color: #d5dcf5; }
      .srow .sval { flex: none; font: 900 50px/1 var(--f); color: var(--orange); white-space: nowrap; }

      .prow { left: 70px; width: 940px; height: 200px; }
      .plab { font: 800 44px/1 var(--f); margin-bottom: 26px; }
      .ptrack { width: 940px; height: 90px; border-radius: 45px; background: rgba(9, 16, 36, 0.85); border: 4px solid var(--line); overflow: hidden; }
      .pfill { height: 100%; border-radius: 45px; }
      .pval { position: absolute; top: 76px; font: 900 56px/90px var(--f); padding-left: 18px; white-space: nowrap; }

      .card { position: absolute; left: 60px; width: 960px; display: flex; align-items: center; gap: 34px; padding: 30px 40px; border-radius: 34px; background: rgba(9, 16, 36, 0.9); font: 800 52px/1.15 var(--f); }
      .card .ic { flex: none; width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; font: 900 72px/1 var(--f); color: #fff; }
      .card.no { top: 480px; border: 5px solid var(--red); box-shadow: 0 0 34px rgba(255, 77, 94, 0.3); }
      .card.no .ic { background: var(--red); }
      .card.no b { color: var(--red); }
      .card.yes { top: 1250px; border: 5px solid var(--green); box-shadow: 0 0 34px rgba(47, 214, 123, 0.3); }
      .card.yes .ic { background: var(--green); }
      .card.yes b { color: var(--orange); }
      .cmp { left: 60px; top: 1540px; width: 960px; display: flex; align-items: center; justify-content: center; gap: 30px; }
      .cmp .arrow { font: 900 72px/1 var(--f); color: var(--orange); }
      .cmp small { display: block; margin-top: 10px; font: 700 26px/1 var(--f); color: var(--muted); text-align: center; }
      .cmp .counter .v { font-size: 64px; }

      .btns { left: 0; top: 1560px; width: 1080px; display: flex; justify-content: center; gap: 60px; }
      .btn { display: flex; flex-direction: column; align-items: center; gap: 16px; font: 800 32px/1 var(--f); letter-spacing: 0.08em; }
      .btn .ring { width: 150px; height: 150px; border-radius: 50%; border: 5px solid var(--cyan); background: rgba(9, 16, 36, 0.85); display: grid; place-items: center; box-shadow: 0 0 34px rgba(54, 209, 255, 0.35); }
      .btn svg { width: 74px; }
    </style>
