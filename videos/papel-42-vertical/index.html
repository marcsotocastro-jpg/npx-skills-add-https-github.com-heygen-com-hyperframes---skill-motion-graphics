    if (mover) tl.to(mover, { opacity: 0, duration: 0.2 }, ta + d);
    charEl(sec, cid, 60, 1230, 290);
    tl.fromTo("#" + cid, { y: 520 }, { y: 0, duration: 0.55, ease: "back.out(1.2)" }, t0 + 0.08);
    ohFace(cid, ta + d);
    arm(cid, "R", -150, ta + d);
    (sc.chips || []).forEach((c, k) => { c.x = c.x ?? 680; c.y = c.y ?? 1110 + k * 110; });
    extraChips(sec, sc, p);
    life(cid, t0, t1);
  };

  B.pct = (sec, sc, t0, t1, p, cid) => {
    sc.rows.forEach((r, k) => {
      const y = 520 + k * 240, [c1, c2] = BARCOL[r.color || (k ? "orange" : "blue")];
      add(sec, `<div class="abs prow" id="${p}-r${k}" style="top:${y}px"><div class="plab">${r.label}</div>
        <div class="ptrack"><div class="pfill" id="${p}-f${k}" style="width:${Math.max(3, r.pct)}%;background:linear-gradient(90deg,${c2},${c1});box-shadow:0 0 26px ${c2}88"></div></div>
        <div class="pval" id="${p}-v${k}" style="left:${Math.min(70, Math.max(3, r.pct)) + 2}%">${r.val}</div></div>`);
      tl.fromTo(`#${p}-r${k}`, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: out }, A(r.at) - 0.15);
      tl.fromTo(`#${p}-f${k}`, { scaleX: 0 }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.9, ease: out, immediateRender: true }, A(r.at));
      tl.fromTo(`#${p}-v${k}`, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: pop, immediateRender: true }, A(r.at) + 0.7);
    });
    charEl(sec, cid, 700, 1180, 320);
    tl.fromTo("#" + cid, { y: 520 }, { y: 0, duration: 0.55, ease: "back.out(1.2)" }, t0 + 0.08);
    const last = A(sc.rows[sc.rows.length - 1].at);
    arm(cid, "L", 150, last);
    ohFace(cid, last + 0.6);
    extraChips(sec, sc, p);
    life(cid, t0, t1);
  };

  B.myth = (sec, sc, t0, t1, p, cid) => {
    add(sec, `<div class="card no" id="${p}-no"><div class="ic">✗</div><div>${sc.no}</div></div>`);
    add(sec, `<div class="abs" id="${p}-il" style="left:170px;top:760px;width:400px">${ICON(sc.illus)}</div>`);
    charEl(sec, cid, 660, 790, 300);
    add(sec, `<div class="card yes" id="${p}-yes"><div class="ic">✓</div><div>${sc.yes}</div></div>`);
    const ty = A(sc.yesAt);
    tl.fromTo(`#${p}-no`, { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.45, ease: out }, t0 + 0.08);
    tl.fromTo(`#${p}-no .ic`, { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: pop }, t0 + 0.3);
    tl.fromTo(`#${p}-il`, { opacity: 0, y: 80, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: pop }, A([sc.from, 1]));
    tl.fromTo("#" + cid, { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.45, ease: out }, A([sc.from, 1]) + 0.1);
    arm(cid, "L", 40, A(lastChunk(sc.from)));
    tl.fromTo(`#${p}-no`, { x: 0 }, { x: 10, duration: 0.05, yoyo: true, repeat: 5, immediateRender: false }, A(lastChunk(sc.from)) + 0.3);
    tl.fromTo(`#${p}-yes`, { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.45, ease: out }, ty);
    tl.fromTo(`#${p}-yes .ic`, { scale: 0 }, { scale: 1, duration: 0.45, ease: pop }, ty + 0.18);
    tl.to(`#${p}-no`, { opacity: 0.45, duration: 0.4 }, ty + 0.08);
    arm(cid, "L", 0, ty + 0.08);
    tl.to(`#${p}-il`, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1 }, ty + 0.3);
    if (sc.cmp) {
      const items = sc.cmp.items;
      const row = add(sec, `<div class="abs cmp" id="${p}-cmp"></div>`);
      items.forEach((it, k) => {
        if (k) add(row, `<div class="arrow">${sc.cmp.sym || "→"}</div>`);
        add(row, `<div><div class="counter ${k === items.length - 1 ? "or" : ""}"><span class="v">${it.v}</span></div><small>${it.label}</small></div>`);
      });
      tl.fromTo(`#${p}-cmp`, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: out }, A(sc.cmp.at));
      ohFace(cid, A(sc.cmp.at) + 0.3);
    } else ohFace(cid, ty + 0.4);
    if (sc.note) { const ne = add(sec, `<div class="abs note" style="left:60px;top:1790px;width:960px;text-align:center">${sc.note}</div>`); tl.fromTo(ne, { opacity: 0 }, { opacity: 1, duration: 0.4 }, ty + 0.5); }
    life(cid, t0, t1);
  };

  B.close = (sec, sc, t0, t1, p, cid) => {
    add(sec, `<div class="glow abs" id="${p}-glow" style="left:290px;top:470px;width:500px;height:500px"></div>`);
    add(sec, `<div class="abs" id="${p}-ic" style="left:440px;top:610px;width:200px">${ICON(sc.icon)}</div>`);
    charEl(sec, cid, 290, 860, 500);
    add(sec, `<div class="abs btns" id="${p}-btns">
      <div class="btn"><div class="ring" id="${p}-bc"><svg viewBox="0 0 64 64"><path d="M10 14h44a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H28l-12 10v-10h-6a6 6 0 0 1-6-6V20a6 6 0 0 1 6-6z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><circle cx="22" cy="31" r="3.5" fill="#ff9b25"/><circle cx="32" cy="31" r="3.5" fill="#ff9b25"/><circle cx="42" cy="31" r="3.5" fill="#ff9b25"/></svg></div>COMENTA</div>
      <div class="btn"><div class="ring" id="${p}-bs"><svg viewBox="0 0 64 64"><path d="M16 8h32a4 4 0 0 1 4 4v46L32 46 12 58V12a4 4 0 0 1 4-4z" fill="#ff9b25" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg></div>GUARDA</div></div>`);
    tl.fromTo("#" + cid, { y: 640 }, { y: 0, duration: 0.55, ease: "back.out(1.3)" }, t0);
    tl.fromTo(`#${p}-ic`, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: pop }, t0 + 0.35);
    tl.fromTo(`#${p}-ic`, { y: 0 }, { y: -24, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((t1 - t0 - 0.8) / 0.6)) }, t0 + 0.8);
    tl.fromTo(`#${p}-glow`, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.6, ease: out }, t0 + 0.35);
    arm(cid, "R", -150, t0 + 0.45);
    tl.to(`#${cid}-armR`, { rotation: -120, svgOrigin: ARM.R, duration: 0.22, yoyo: true, repeat: 7, ease: "sine.inOut" }, t0 + 0.8);
    const tb = A(lastChunk(sc.from)) - 0.3;
    tl.fromTo(`#${p}-btns .btn`, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.5, ease: pop, stagger: 0.18 }, tb);
    tl.to(`#${p}-bc`, { scale: 1.12, duration: 0.22, yoyo: true, repeat: 3, ease: "sine.inOut" }, tb + 0.7);
    tl.to(`#${p}-bs`, { scale: 1.12, duration: 0.22, yoyo: true, repeat: 3, ease: "sine.inOut" }, tb + 1.5);
    life(cid, t0, t1);
  };

  // ---------------- Assemble ----------------
  tl.fromTo("#rim-a", { x: 0, y: 0 }, { x: -260, y: 200, duration: END, ease: "none" }, 0);
  tl.fromTo("#rim-b", { x: 0, y: 0 }, { x: 240, y: -160, duration: END, ease: "none" }, 0);
  tl.fromTo("#panels", { y: 0 }, { y: -60, duration: END, ease: "none" }, 0);
  S.scenes.forEach((sc, i) => {
    const sec = document.getElementById("s" + i), [t0, t1] = SCN[i];
    B[sc.type](sec, sc, t0, t1, "s" + i, "c" + i);
    if (i > 0) tl.fromTo(sec, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none", immediateRender: false }, t0);
    if (i < S.scenes.length - 1) tl.to(sec, { opacity: 0, duration: 0.22, ease: inn }, t1 - 0.12);
  });
  tl.set({}, {}, END);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
})();
    </script>
  </body>
</html>
