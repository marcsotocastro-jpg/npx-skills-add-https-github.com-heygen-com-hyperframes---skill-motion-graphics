      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.45, duration: 0.06, yoyo: true, repeat: 1, immediateRender: false }, G.stop);
      tl.to(groups, { "--c": "#7d68e8", "--d": "#2e2180", duration: 0.3 }, G.stop);
      tl.to(".num", { opacity: 1, duration: 0.25 }, G.stop + 0.3);
      tl.fromTo(balls, { scale: 1 }, { scale: 1.2, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut", stagger: 0.08, immediateRender: false }, G.stop + 0.3);
      tl.to("#diff", { opacity: 0, duration: 0.3 }, G.cd - 0.4);
      tl.fromTo("#cd", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: pop }, G.cd - 0.2);
      ["#cd3", "#cd2", "#cd1"].forEach((id, k) => {
        tl.fromTo(id, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, G.cd + k);
        tl.to(id, { opacity: 0, duration: 0.15 }, G.cd + k + 0.85);
      });
      tl.fromTo("#cd", { borderColor: "#ffd23f" }, { borderColor: "#ff4d5e", duration: 3, ease: "none", immediateRender: false }, G.cd);
      tl.to("#cd", { opacity: 0, scale: 0.6, duration: 0.25 }, G.reveal - 0.05);

      // ---- reveal
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.35, duration: 0.06, yoyo: true, repeat: 1, immediateRender: false }, G.reveal);
      tl.to("#g0", { "--c": "#ff3b4e", "--d": "#9e0f25", duration: 0.2 }, G.reveal);
      tl.to(["#g1", "#g2", "#g3"], { opacity: 0.28, duration: 0.3 }, G.reveal);
      tl.fromTo("#ball0", { scale: 1 }, { scale: 1.45, duration: 0.45, ease: pop, immediateRender: false }, G.reveal);
      tl.fromTo("#ball0 .ring", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: pop }, G.reveal + 0.1);
      tl.to("#ball0 .ring", { scale: 1.15, duration: 0.4, yoyo: true, repeat: 5, ease: "sine.inOut" }, G.reveal + 0.5);
      tl.fromTo("#cta", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, G.reveal + 1.4);
      tl.fromTo("#cta span", { scale: 0.6 }, { scale: 1, duration: 0.4, ease: pop, stagger: 0.08 }, G.reveal + 1.4);
      tl.to("#cta span:nth-child(" + G.red + ")", { background: "#ffd23f", color: "#140f2b", scale: 1.15, duration: 0.3 }, G.reveal + 2.0);

      // ---- captions
      const capsEl = document.getElementById("caps");
      G.caps.forEach(([t0, t1, html]) => {
        const el = document.createElement("div");
        el.className = "cap";
        el.innerHTML = html;
        capsEl.appendChild(el);
        tl.fromTo(el, { opacity: 0, scale: 0.86, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: pop, immediateRender: false }, t0);
        tl.set(el, { opacity: 0 }, t1);
      });

      tl.set({}, {}, G.end);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
